# zizmor configuration
# https://docs.zizmor.sh/configuration/

rules:
  # Disable unpinned-uses - pinning to SHA hashes is a significant change
  # that should be done deliberately, not enforced by pre-commit
  unpinned-uses:
    disable: true

  # Disable excessive-permissions for now - adding explicit permissions
  # blocks requires careful review of each workflow's needs
  excessive-permissions:
    disable: true

  # Disable artipacked (persist-credentials) - low confidence finding
  artipacked:
    disable: true

  # Labelling a pull request from a fork needs a token the fork's own run cannot
  # have, which is what pull_request_target is for. Both workflows only call the
  # GitHub API through pinned actions and never check out or execute the pull
  # request's code, so the escalation this rule guards against has no path here.
  # Scope the exemption to these two files rather than disabling the rule.
  dangerous-triggers:
    ignore:
      - auto-response.yml
      - labeler.yml
